<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - StayNear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="index.html">StayNear</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-intro">
                <p class="auth-small-text">ACCOUNT RECOVERY</p>
                <h1>Reset your password.</h1>
                <p>Enter the email address for your StayNear account. If it is registered, we’ll send you a secure reset link.</p>
            </div>

            <section class="auth-box-new" aria-labelledby="forgotPasswordTitle">
                <h2 id="forgotPasswordTitle">Forgot password?</h2>
                <p class="auth-subtitle">We’ll email you a link to choose a new password.</p>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="forgotEmail">Email</label>
                        <input type="email" id="forgotEmail" name="email" placeholder="you@example.com" autocomplete="email" maxlength="254" required>
                    </div>

                    <button type="submit" class="auth-submit">Send reset link</button>
                    <p id="forgotPasswordFeedback" class="auth-feedback" role="status" aria-live="polite" hidden></p>
                </form>

                <p class="auth-bottom-text"><a href="login.html">Back to login</a></p>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
