<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password - StayNear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="index.html">StayNear</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-intro">
                <p class="auth-small-text">ACCOUNT RECOVERY</p>
                <h1>Choose a new password.</h1>
                <p>For your security, this one-time reset link expires after 30 minutes.</p>
            </div>

            <section class="auth-box-new" aria-labelledby="resetPasswordTitle">
                <h2 id="resetPasswordTitle">Reset password</h2>
                <p class="auth-subtitle">Use at least 10 characters with uppercase, lowercase, and a number (up to 72 UTF-8 bytes).</p>

                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="10" maxlength="72" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{10,72}" title="Use at least 10 characters with uppercase, lowercase, and a number." required>
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm new password</label>
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password" minlength="10" maxlength="72" required>
                    </div>

                    <button type="submit" class="auth-submit">Update password</button>
                </form>

                <p id="resetPasswordFeedback" class="auth-feedback" role="status" aria-live="polite" hidden></p>
                <p class="auth-bottom-text"><a id="resetLoginLink" href="login.html" hidden>Continue to login</a></p>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
