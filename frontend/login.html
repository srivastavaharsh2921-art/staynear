<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - StayNear</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            StayNear
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </nav>

    </header>



    <!-- LOGIN -->

    <main class="auth-page">


        <div class="auth-container">


            <!-- LEFT SIDE -->

            <div class="auth-intro">

                <p class="auth-small-text">
                    WELCOME BACK
                </p>

                <h1>
                    Find your
                    <br>
                    next stay.
                </h1>

                <p>
                    Login to continue exploring
                    comfortable student accommodation
                    near your university.
                </p>

            </div>



            <!-- LOGIN BOX -->

            <div class="auth-box-new">

                <h2>
                    Login
                </h2>

                <p class="auth-subtitle">
                    Enter your details to continue.
                </p>


                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>



                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Login
                    </button>


                </form>


                <p class="auth-bottom-text">

                    Don't have an account?

                    <a href="signup.html">
                        Create one
                    </a>

                </p>


            </div>


        </div>


    </main>



    <script src="script.js"></script>

</body>

</html>
