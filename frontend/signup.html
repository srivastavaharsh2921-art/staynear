<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - StayNear</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            StayNear
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>



    <!-- SIGNUP -->

    <main class="auth-page">


        <div class="auth-container">


            <!-- LEFT SIDE -->

            <div class="auth-intro">

                <p class="auth-small-text">
                    JOIN STAYNEAR
                </p>

                <h1>
                    Your next
                    <br>
                    stay starts here.
                </h1>

                <p>
                    Create your StayNear account and
                    discover accommodation that fits
                    your college life.
                </p>

            </div>



            <!-- SIGNUP BOX -->

            <div class="auth-box-new">

                <h2>
                    Create Account
                </h2>

                <p class="auth-subtitle">
                    Join StayNear today.
                </p>


                <form id="signupForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="signupEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="signupPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>



                    <!-- ROLE -->

                    <div class="form-group">

                        <label for="role">
                            I am a
                        </label>

                        <select id="role">

                            <option value="student">
                                Student
                            </option>

                            <option value="owner">
                                Property Owner
                            </option>

                        </select>

                    </div>



                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="auth-submit"
                    >
                        Create Account
                    </button>


                </form>


                <p class="auth-bottom-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


            </div>


        </div>


    </main>



    <script src="script.js"></script>

</body>

</html>
